<text x="39" y="117" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">Router factory</text>
<text x="39" y="144" font-family="Arial" font-size="14" fill="#334155">createAttendanceRouter()</text>
<text x="39" y="167" font-family="Arial" font-size="14" fill="#334155">HTML and JSON routes</text>
