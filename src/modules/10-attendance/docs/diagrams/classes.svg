<text x="714" y="167" font-family="Arial" font-size="14" fill="#334155">validateFilter()</text>
<text x="714" y="190" font-family="Arial" font-size="14" fill="#334155">renderForm()</text>
<text x="714" y="213" font-family="Arial" font-size="14" fill="#334155">renderHistory()</text>
