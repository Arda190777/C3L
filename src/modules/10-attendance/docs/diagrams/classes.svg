<text x="39" y="213" font-family="Arial" font-size="14" fill="#334155">Uses injected storage</text>
<rect x="355" y="90" width="265" height="240" rx="6" fill="#eff6ff" stroke="#64748b"/>
<text x="369" y="117" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">AttendanceStore</text>
<text x="369" y="144" font-family="Arial" font-size="14" fill="#334155">filename, database</text>
